<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly Expense Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
    input, select, button { font-family: inherit; font-size: 14px; outline: none; }
    input { background: #fff; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 8px; padding: 0 10px; color: #1a1a18; }
    input:focus { border-color: rgba(0,0,0,0.4); box-shadow: 0 0 0 2px rgba(55,138,221,0.15); }
    button { background: transparent; border: 0.5px solid rgba(0,0,0,0.25); border-radius: 8px; padding: 0 14px; cursor: pointer; color: #1a1a18; transition: background .15s; }
    button:hover { background: rgba(0,0,0,0.05); }
    button:active { transform: scale(0.98); }

    .dash { max-width: 780px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 1.5rem; color: #1a1a18; }
    .section-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #888780; margin: 0 0 8px; }
    .metric-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-bottom: 1.5rem; }
    .metric { background: #eae8e2; border-radius: 8px; padding: 12px 14px; }
    .metric-val { font-size: 22px; font-weight: 500; color: #1a1a18; margin: 0; }
    .metric-lbl { font-size: 12px; color: #5f5e5a; margin: 0 0 4px; }
    .metric-sub { font-size: 11px; color: #888780; margin: 4px 0 0; }
    .panels { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; margin-bottom: 12px; }
    .card { background: #fff; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 12px; padding: 1rem 1.25rem; }
    .add-row { display: grid; grid-template-columns: 1fr 120px 88px; gap: 8px; align-items: center; margin-bottom: 1rem; }
    .add-row input, .add-row select { height: 36px; }
    .add-row button { height: 36px; }
    .cat-list { list-style: none; max-height: 240px; overflow-y: auto; }
    .cat-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 0.5px solid rgba(0,0,0,0.08); font-size: 13px; }
    .cat-item:last-child { border-bottom: none; }
    .dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .cat-name { flex: 1; color: #1a1a18; }
    .cat-amt { font-weight: 500; color: #1a1a18; min-width: 64px; text-align: right; }
    .cat-pct { font-size: 11px; color: #888780; min-width: 36px; text-align: right; }
    .del-btn { background: none; border: none; cursor: pointer; color: #b4b2a9; font-size: 14px; padding: 0 2px; line-height: 1; }
    .del-btn:hover { color: #5f5e5a; }
    .progress-track { height: 6px; background: #eae8e2; border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width .3s; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; font-size: 12px; color: #5f5e5a; }
    .leg-item { display: flex; align-items: center; gap: 5px; }
    .empty-state { color: #b4b2a9; font-size: 13px; text-align: center; padding: 2rem 0; }

    @media (max-width: 520px) {
      .panels { grid-template-columns: 1fr; }
      .add-row { grid-template-columns: 1fr 100px 72px; }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a18; color: #f1efe8; }
      input { background: #2c2c2a; border-color: rgba(255,255,255,0.15); color: #f1efe8; }
      input::placeholder { color: #888780; }
      button { border-color: rgba(255,255,255,0.2); color: #f1efe8; }
      button:hover { background: rgba(255,255,255,0.06); }
      .metric { background: #2c2c2a; }
      .metric-val, .cat-name, .cat-amt, h1 { color: #f1efe8; }
      .metric-lbl { color: #b4b2a9; }
      .metric-sub, .section-label, .cat-pct, .legend { color: #888780; }
      .card { background: #222220; border-color: rgba(255,255,255,0.08); }
      .cat-item { border-color: rgba(255,255,255,0.07); }
      .del-btn { color: #5f5e5a; }
      .del-btn:hover { color: #b4b2a9; }
      .progress-track { background: #2c2c2a; }
      .empty-state { color: #5f5e5a; }
    }
  </style>
</head>
<body>
<div class="dash">
  <h1>Monthly Expense Dashboard</h1>
  <div class="metric-row" id="metrics"></div>

  <div class="card" style="margin-bottom:12px">
    <p class="section-label">Add expense</p>
    <div class="add-row">
      <input type="text" id="inp-name" placeholder="Category (e.g. Rent)" />
      <input type="number" id="inp-amt" placeholder="Amount" min="0" step="0.01" />
      <button onclick="addExpense()">+ Add</button>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <span style="font-size:12px; color:#888780;">Budget:</span>
      <input type="number" id="inp-budget" placeholder="Monthly budget" min="0" step="1" style="height:32px; width:150px; font-size:13px;" />
      <button onclick="setBudget()" style="height:32px; font-size:12px; padding:0 10px;">Set</button>
    </div>
  </div>

  <div class="panels">
    <div class="card">
      <p class="section-label" style="margin-bottom:0">Breakdown</p>
      <div style="position:relative; height:220px; margin:8px 0 4px;"><canvas id="donut"></canvas></div>
      <div class="legend" id="donut-legend"></div>
    </div>
    <div class="card">
      <p class="section-label">Categories</p>
      <ul class="cat-list" id="cat-list"><li class="empty-state">No expenses yet</li></ul>
    </div>
  </div>

  <div class="card">
    <p class="section-label" style="margin-bottom:12px">Budget tracker</p>
    <div id="budget-section">
      <p style="font-size:13px; color:#888780; margin:0;">Set a budget above to track spending.</p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const COLORS = ['#378ADD','#1D9E75','#D85A30','#D4537E','#BA7517','#533AB7','#639922','#E24B4A','#0F6E56','#993C1D'];
let expenses = [];
let budget = 0;
let donutChart = null;

function addExpense() {
  const name = document.getElementById('inp-name').value.trim();
  const amt = parseFloat(document.getElementById('inp-amt').value);
  if (!name || isNaN(amt) || amt <= 0) return;
  const existing = expenses.find(e => e.name.toLowerCase() === name.toLowerCase());
  if (existing) { existing.amount += amt; } else { expenses.push({ name, amount: amt }); }
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-amt').value = '';
  render();
}

function deleteExpense(i) { expenses.splice(i, 1); render(); }

function setBudget() {
  const v = parseFloat(document.getElementById('inp-budget').value);
  if (!isNaN(v) && v >= 0) { budget = v; render(); }
}

document.getElementById('inp-amt').addEventListener('keydown', e => { if (e.key === 'Enter') addExpense(); });
document.getElementById('inp-budget').addEventListener('keydown', e => { if (e.key === 'Enter') setBudget(); });

function fmt(n) { return n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }

function render() {
  const total = expenses.reduce((s, e) => s + e.amount, 0);
  const avg = expenses.length ? total / expenses.length : 0;
  const largest = expenses.length ? expenses.reduce((m, e) => e.amount > m.amount ? e : m) : null;

  document.getElementById('metrics').innerHTML = `
    <div class="metric"><p class="metric-lbl">Total spent</p><p class="metric-val">$${fmt(total)}</p><p class="metric-sub">${expenses.length} categories</p></div>
    <div class="metric"><p class="metric-lbl">Avg per category</p><p class="metric-val">$${fmt(avg)}</p></div>
    <div class="metric"><p class="metric-lbl">Largest expense</p><p class="metric-val">${largest ? '$'+fmt(largest.amount) : '—'}</p><p class="metric-sub">${largest ? largest.name : ''}</p></div>
  `;

  const sorted = [...expenses].sort((a,b) => b.amount - a.amount);

  const list = document.getElementById('cat-list');
  if (!sorted.length) { list.innerHTML = '<li class="empty-state">No expenses yet</li>'; } else {
    list.innerHTML = sorted.map((e, i) => {
      const pct = total ? Math.round(e.amount / total * 100) : 0;
      const ci = expenses.indexOf(e);
      return `<li class="cat-item"><span class="dot" style="background:${COLORS[i % COLORS.length]}"></span><span class="cat-name">${e.name}</span><span class="cat-amt">$${fmt(e.amount)}</span><span class="cat-pct">${pct}%</span><button class="del-btn" onclick="deleteExpense(${ci})" title="Remove">✕</button></li>`;
    }).join('');
  }

  const canvas = document.getElementById('donut');
  if (donutChart) { donutChart.destroy(); donutChart = null; }
  if (sorted.length) {
    donutChart = new Chart(canvas, {
      type: 'doughnut',
      data: { labels: sorted.map(e=>e.name), datasets: [{ data: sorted.map(e=>e.amount), backgroundColor: sorted.map((_,i)=>COLORS[i%COLORS.length]), borderWidth: 0, hoverOffset: 4 }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '68%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` $${fmt(ctx.raw)} (${total?Math.round(ctx.raw/total*100):0}%)` } } } }
    });
    document.getElementById('donut-legend').innerHTML = sorted.map((e,i) => `<span class="leg-item"><span style="width:10px;height:10px;border-radius:2px;background:${COLORS[i%COLORS.length]};display:inline-block;"></span>${e.name}</span>`).join('');
  } else {
    document.getElementById('donut-legend').innerHTML = '';
  }

  const bs = document.getElementById('budget-section');
  if (!budget) {
    bs.innerHTML = `<p style="font-size:13px; color:#888780; margin:0;">Set a budget above to track spending.</p>`;
  } else {
    const pct = Math.min(100, Math.round(total / budget * 100));
    const rem = budget - total;
    const over = rem < 0;
    const barColor = pct < 70 ? '#1D9E75' : pct < 90 ? '#BA7517' : '#E24B4A';
    bs.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:13px;"><span style="color:#888780;">Spent</span><span style="font-weight:500">$${fmt(total)} / $${fmt(budget)}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${barColor};"></div></div>
      <div style="display:flex; justify-content:space-between; font-size:13px;">
        <span style="color:#888780;">${pct}% used</span>
        <span style="color:${over?'#E24B4A':'#1D9E75'}; font-weight:500;">${over ? 'Over by $'+fmt(-rem) : '$'+fmt(rem)+' remaining'}</span>
      </div>
    `;
  }
}

render();
</script>
</body>
</html>
